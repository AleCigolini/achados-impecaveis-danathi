<section class="produto-detalhe">
  <a class="voltar" href="/">← Voltar pros achadinhos</a>
  <div class="produto-grid">
    <div class="produto-img" style="background-image:url('{{image}}')"></div>
    <div class="produto-info">
      <span class="product-tag">{{tag}}</span>
      <h1 class="produto-nome">{{name}}</h1>
      <p class="produto-loja">Vendido via {{loja}}</p>
      <p class="produto-preco">de <s>{{priceOld}}</s> por <strong>{{priceNew}}</strong></p>
      <p class="produto-desc">{{description}}</p>
      <div class="produto-cta-group">
        <a class="cta-primary" href="{{affiliateLink}}" target="_blank" rel="noopener sponsored">Ver oferta →</a>
        <a class="cta-outline" href="{{whatsappGroup}}" target="_blank" rel="noopener">Ou entre no grupo do WhatsApp</a>
      </div>
    </div>
  </div>
</section>
